<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 Not Found | OmuOmu Life</title>
		<link
			rel="icon"

		/>

		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {

						colors: {
							'omu-egg': '#FFD966',
							'omu-egg-light': '#FFF4C1',
							'omu-ketchup': '#FF6B6B',
							'omu-rice': '#FAF9F6',
							'omu-demi': '#5D4037',
							'omu-green': '#88D8B0',

						fontFamily: {
							body: ['"M PLUS Rounded 1c"', 'sans-serif'],
							title: ['"Kiwi Maru"', 'serif'],
						},
					},
				},
			};
		</script>
		<link rel="stylesheet" href="css/style.css" />

	<body class="flex flex-col min-h-screen text-omu-demi bg-omu-rice">
		<!-- ヘッダー -->
		<header class="wavy-bottom shadow-sm">

					>
						🍳
					</div>

						class="font-title text-2xl md:text-3xl font-bold tracking-wider text-omu-demi"
					>

			class="container mx-auto px-6 py-20 flex-grow flex flex-col items-center justify-center text-center"
		>

			<div class="relative mb-8">
				<div class="text-9xl animate-bounce relative z-10">🍳💦</div>
				<div
					class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 w-32 h-4 bg-black/10 rounded-full blur-sm"

			</div>

			</p>

			<a
				href="/"
				class="bg-omu-ketchup text-white px-8 py-4 rounded-full font-bold shadow-lg hover:bg-red-500 hover:shadow-xl transition-all transform hover:-translate-y-1 flex items-center gap-2"
			>
				<span>🏠 トップページに戻る</span>
			</a>

		<footer
			class="bg-omu-demi text-omu-rice pt-12 pb-8 rounded-t-[40px] mt-10 relative overflow-hidden"

			</div>
